{% extends 'base.html' %}
{% load static %}


{% block content %}

<h2>Recipe List</h2>
    <ol>
        {% for recipe in object_list %}
        <li>
            <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
        </li>
        {% endfor %}
    </ol>

    <br>

    <a href="/recipe/add">
        Add Recipe
    </a>
    
    <br>
    <br>
    <hr>
    <br>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Logout</button>
    </form>

{% endblock %}
